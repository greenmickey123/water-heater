<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>☀️ 太阳能热水器</title>
  <!-- Chart.js 图表库 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #F2F2F7;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.4);
      --text-main: #1C1C1E;
      --text-sub: #8E8E93;
      --accent: #007AFF;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card-bg: rgba(28, 28, 30, 0.85);
        --card-border: rgba(255, 255, 255, 0.1);
        --text-main: #FFFFFF;
        --text-sub: #8E8E93;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
    }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 24px) 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      padding: 12px 4px 4px 4px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .btn-refresh {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow);
      box-sizing: border-box;
    }
    .main-metric {
      text-align: center;
      padding: 10px 0;
    }
    .comfort-badge {
      display: inline-block;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 30px;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }
    .temp-number {
      font-size: 78px;
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;
      margin: 10px 0;
      transition: color 0.3s ease;
    }
    .unit {
      font-size: 32px;
      font-weight: 600;
      vertical-align: top;
      margin-left: 2px;
    }
    .advice {
      font-size: 14px;
      color: var(--text-sub);
      margin-top: 8px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: rgba(142, 142, 147, 0.08);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 16px;
      font-weight: 700;
    }
    .chart-header {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chart-range {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 500;
    }
    .chart-box {
      width: 100%;
      height: 190px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div>
        <h1 class="title">☀️ 太阳能热水器</h1>
        <div class="subtitle" id="updateTime">正在同步最新数据...</div>
      </div>
      <button class="btn-refresh" onclick="fetchData()">刷新</button>
    </div>

    <!-- 核心水温大卡片 (颜色根据温度自动变化) -->
    <div class="card main-metric">
      <div class="comfort-badge" id="comfortBadge" style="background: rgba(0,122,255,0.1); color: var(--accent);">正在同步</div>
      <div class="temp-number">
        <span id="tempValue">--</span><span class="unit">°C</span>
      </div>
      <div class="advice" id="tempAdvice">正在从云端调取传感器读数...</div>
    </div>

    <!-- 设备副指标网格 (包含盒内温湿度与超温警示) -->
    <div class="card">
      <!-- 盒温超标警示横幅 (>=50°C 时自动弹出高亮警示) -->
      <div id="boxWarningBanner" style="display: none; background: rgba(255, 59, 48, 0.12); border: 1px solid rgba(255, 59, 48, 0.3); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: #FF3B30; align-items: center; gap: 8px;">
        <span>⚠️ 盒内高温警示：温度已超 50°C，请检查遮阳或将防水盒移至阴凉背光处！</span>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">🔋 电池电量</div>
          <div class="stat-val" id="batPercent">--%</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">⚡️ 电池电压</div>
          <div class="stat-val" id="batVoltage">-- V</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">🌤 供电状态</div>
          <div class="stat-val" id="solarStatus">--</div>
          <div id="deviceMetaVal" style="font-size: 11px; color: var(--text-sub); margin-top: 3px; font-family: monospace;">--</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">📶 Wi-Fi 信号</div>
          <div class="stat-val" id="wifiRssi">-- dBm</div>
          <div id="bssidVal" style="font-size: 11px; color: var(--text-sub); margin-top: 3px; font-family: monospace;">--</div>
        </div>
        <div class="stat-item" id="boxTempCard">
          <div class="stat-label">📦 盒内温度 (SHT31)</div>
          <div class="stat-val" id="boxTemp">-- °C</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">💧 盒内湿度 (SHT31)</div>
          <div class="stat-val" id="boxHumi">-- %</div>
        </div>
      </div>
    </div>

    <!-- 图表 1：水温走势曲线 (严格 24 小时) -->
    <div class="card">
      <div class="chart-header">
        <span>📈 水温走势曲线</span>
        <span class="chart-range">最近 24 小时</span>
      </div>
      <div class="chart-box">
        <canvas id="tempChart"></canvas>
      </div>
    </div>

    <!-- 图表 2：盒内温湿度走势 (双 Y 轴同图显示) -->
    <div class="card">
      <div class="chart-header">
        <span>📦 盒内温湿度走势</span>
        <span class="chart-range">最近 24 小时</span>
      </div>
      <div class="chart-box">
        <canvas id="boxEnvChart"></canvas>
      </div>
    </div>

    <!-- 图表 3：电池电量走势曲线 (严格 24 小时) -->
    <div class="card">
      <div class="chart-header">
        <span>🔋 电池电量走势</span>
        <span class="chart-range">最近 24 小时</span>
      </div>
      <div class="chart-box">
        <canvas id="batChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const CHANNEL_ID = "3569758";
    const READ_KEY = "A2LU28QO3OKLBI54";
    let tempChartInstance = null;
    let boxChartInstance = null;
    let batChartInstance = null;

    async function fetchData() {
      const timeElem = document.getElementById('updateTime');
      const tempElem = document.getElementById('tempValue');
      const badgeElem = document.getElementById('comfortBadge');
      const adviceElem = document.getElementById('tempAdvice');
      const batPctElem = document.getElementById('batPercent');
      const batVoltElem = document.getElementById('batVoltage');
      const solarElem = document.getElementById('solarStatus');
      const wifiElem = document.getElementById('wifiRssi');

      timeElem.innerText = "正在刷新...";

      try {
        const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_KEY}&results=200&status=true`;
        const res = await fetch(url);
        const json = await res.json();
        const feeds = json.feeds || [];

        if (feeds.length > 0) {
          const latest = feeds[feeds.length - 1];
          const temp = parseFloat(latest.field1) || 0.0;
          const volt = parseFloat(latest.field2) || 0.0;
          const pct = parseInt(latest.field3) || 0;
          const rssi = parseInt(latest.field4) || 0;
          const isCharging = parseInt(latest.field5) === 1;
          const bTemp = latest.field6 ? parseFloat(latest.field6) : null;
          const bHumi = latest.field7 ? parseFloat(latest.field7) : null;

          tempElem.innerText = temp.toFixed(1);
          batPctElem.innerText = `${pct}%`;
          batVoltElem.innerText = `${volt.toFixed(2)} V`;
          wifiElem.innerText = `${rssi} dBm`;
          const bssidElem = document.getElementById('bssidVal');
          const metaElem = document.getElementById('deviceMetaVal');

          if (latest.status) {
            const parts = latest.status.split(',');
            if (parts.length >= 3) {
              const ver = parts[0];
              const ip = parts[1];
              const bssid = parts[2];
              metaElem.innerText = `${ip} · ${ver}`;
              bssidElem.innerText = bssid;
            } else {
              bssidElem.innerText = latest.status;
              metaElem.innerText = "";
            }
          } else {
            bssidElem.innerText = "";
            metaElem.innerText = "";
          }

          const boxTElem = document.getElementById('boxTemp');
          const boxHElem = document.getElementById('boxHumi');
          const boxCard = document.getElementById('boxTempCard');
          const warnBanner = document.getElementById('boxWarningBanner');

          if (bTemp !== null) {
            boxTElem.innerText = `${bTemp.toFixed(1)} °C`;
            boxHElem.innerText = `${bHumi.toFixed(0)} %`;

            // 盒温超标警示逻辑：>= 50°C 标红预警并弹出醒目 Banner
            if (bTemp >= 50.0) {
              boxTElem.style.color = "#FF3B30";
              boxCard.style.background = "rgba(255, 59, 48, 0.12)";
              boxCard.style.border = "1px solid rgba(255, 59, 48, 0.4)";
              warnBanner.style.display = "flex";
            } else if (bTemp >= 42.0) {
              boxTElem.style.color = "#FF9500";
              boxCard.style.background = "rgba(142, 142, 147, 0.08)";
              boxCard.style.border = "none";
              warnBanner.style.display = "none";
            } else {
              boxTElem.style.color = "var(--text-main)";
              boxCard.style.background = "rgba(142, 142, 147, 0.08)";
              boxCard.style.border = "none";
              warnBanner.style.display = "none";
            }
          } else {
            boxTElem.innerText = "--";
            boxHElem.innerText = "--";
            warnBanner.style.display = "none";
          }

          if (isCharging) {
            solarElem.innerText = "⚡️ 正在充电";
            solarElem.style.color = "#34C759";
          } else {
            solarElem.innerText = "🔋 电池供电";
            solarElem.style.color = "var(--text-main)";
          }

          // 水温颜色与舒适度分级计算 (定制逻辑)
          if (temp >= 60.0) {
            // >= 60°C：极烫红色
            badgeElem.style.background = "rgba(255, 59, 48, 0.12)";
            badgeElem.style.color = "#FF3B30";
            tempElem.style.color = "#FF3B30";
            badgeElem.innerText = "🔥 水温极高";
            adviceElem.innerText = "水温非常烫，洗澡务必调配冷水防烫伤！";
          } else if (temp >= 42.0) {
            // 42°C ~ 60°C：舒适绿色
            badgeElem.style.background = "rgba(52, 199, 89, 0.12)";
            badgeElem.style.color = "#34C759";
            tempElem.style.color = "#34C759";
            badgeElem.innerText = "🚿 水温适宜";
            adviceElem.innerText = "水温非常适合洗澡，可直接洗浴";
          } else {
            // < 42°C：偏冷蓝色
            badgeElem.style.background = "rgba(0, 122, 255, 0.12)";
            badgeElem.style.color = "#007AFF";
            tempElem.style.color = "#007AFF";
            badgeElem.innerText = "❄️ 水温偏冷";
            adviceElem.innerText = "水温偏低不适合洗澡，建议打开电热水器加热";
          }

          const lastDate = new Date(latest.created_at);
          timeElem.innerText = `更新于 ${lastDate.getHours().toString().padStart(2, '0')}:${lastDate.getMinutes().toString().padStart(2, '0')}:${lastDate.getSeconds().toString().padStart(2, '0')}`;

          renderCharts(feeds);
        }
      } catch (e) {
        timeElem.innerText = "网络异常，未能获取最新数据";
      }
    }

    function renderCharts(feeds) {
      const labels = [];
      const tempData = [];
      const boxTData = [];
      const boxHData = [];
      const batData = [];

      const now = new Date();
      const cutoff24h = new Date(now.getTime() - 24 * 60 * 60 * 1000);

      const filteredFeeds = feeds.filter(f => new Date(f.created_at) >= cutoff24h);

      filteredFeeds.forEach(f => {
        const d = new Date(f.created_at);
        labels.push(`${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`);
        tempData.push(f.field1 ? parseFloat(f.field1) : null);
        batData.push(f.field3 ? parseInt(f.field3) : null);
        boxTData.push(f.field6 ? parseFloat(f.field6) : null);
        boxHData.push(f.field7 ? parseFloat(f.field7) : null);
      });

      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const gridColor = isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.05)';
      const textColor = isDark ? '#8E8E93' : '#8E8E93';

      // 1. 水温图表
      const ctxTemp = document.getElementById('tempChart').getContext('2d');
      if (tempChartInstance) tempChartInstance.destroy();
      tempChartInstance = new Chart(ctxTemp, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '水温 (°C)',
            data: tempData,
            borderColor: '#FF9500',
            backgroundColor: 'rgba(255, 149, 0, 0.08)',
            borderWidth: 2.5,
            fill: true,
            tension: 0.35,
            pointRadius: 2,
            pointHoverRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: textColor, maxTicksLimit: 6 } },
            y: { grid: { color: gridColor }, ticks: { color: textColor } }
          }
        }
      });

      // 2. 盒内温湿度同图双 Y 轴图表 (红线温度 / 蓝虚线湿度)
      const ctxBox = document.getElementById('boxEnvChart').getContext('2d');
      if (boxChartInstance) boxChartInstance.destroy();
      boxChartInstance = new Chart(ctxBox, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '盒内温度 (°C)',
              data: boxTData,
              borderColor: '#FF2D55',
              backgroundColor: 'rgba(255, 45, 85, 0.05)',
              borderWidth: 2.2,
              fill: false,
              tension: 0.35,
              pointRadius: 2,
              yAxisID: 'yTemp'
            },
            {
              label: '盒内湿度 (%)',
              data: boxHData,
              borderColor: '#5AC8FA',
              borderDash: [4, 4],
              backgroundColor: 'transparent',
              borderWidth: 2.0,
              fill: false,
              tension: 0.35,
              pointRadius: 2,
              yAxisID: 'yHumi'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: { color: textColor, boxWidth: 12, font: { size: 11 } }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: textColor, maxTicksLimit: 6 } },
            yTemp: {
              type: 'linear',
              position: 'left',
              grid: { color: gridColor },
              ticks: { color: '#FF2D55', callback: v => v + '°C' }
            },
            yHumi: {
              type: 'linear',
              position: 'right',
              min: 0,
              max: 100,
              grid: { display: false },
              ticks: { color: '#5AC8FA', callback: v => v + '%' }
            }
          }
        }
      });

      // 3. 电池电量图表
      const ctxBat = document.getElementById('batChart').getContext('2d');
      if (batChartInstance) batChartInstance.destroy();
      batChartInstance = new Chart(ctxBat, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '剩余电量 (%)',
            data: batData,
            borderColor: '#34C759',
            backgroundColor: 'rgba(52, 199, 89, 0.08)',
            borderWidth: 2.5,
            fill: true,
            tension: 0.35,
            pointRadius: 2,
            pointHoverRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: textColor, maxTicksLimit: 6 } },
            y: {
              min: 0,
              max: 100,
              grid: { color: gridColor },
              ticks: { color: textColor, callback: v => v + '%' }
            }
          }
        }
      });
    }

    fetchData();
    setInterval(fetchData, 60000); // 每一分钟静默拉取一次最新数据
  </script>
</body>
</html>
